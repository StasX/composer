name: Dockerfile scans and image publishing
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dockerfile-scans:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Hadolint, id: hadolint, image: hadolint/hadolint:v2.15.1 }
          - { name: Checkov, id: checkov, image: ghcr.io/bridgecrewio/checkov:3.4.3 }
          - { name: Semgrep, id: semgrep, image: semgrep/semgrep:1.183.0 }
          - { name: Trivy Dockerfile, id: trivy-dockerfile, image: aquasec/trivy:0.76.1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Prepare reports
        run: mkdir -p "$RUNNER_TEMP/checkov-reports"
      - name: Run scanner
        env:
          SCANNER: ${{ matrix.id }}
          REPORT_DIR: ${{ runner.temp }}/checkov-reports
        shell: bash
        run: |
          case "$SCANNER" in
            hadolint) docker run --rm --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" --workdir /workspace --entrypoint /bin/hadolint hadolint/hadolint:v2.15.1 --format json Dockerfile 2> >(tee "$REPORT_DIR/hadolint.log" >&2) | tee "$REPORT_DIR/hadolint.json" ;;
            checkov) docker run --rm --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" --workdir /workspace --entrypoint checkov ghcr.io/bridgecrewio/checkov:3.4.3 --file Dockerfile --framework dockerfile --skip-download --skip-check CKV_DOCKER_2 --output json 2> >(tee "$REPORT_DIR/checkov.log" >&2) | tee "$REPORT_DIR/checkov.json" ;;
            semgrep) docker run --rm --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" --workdir /workspace --entrypoint semgrep semgrep/semgrep:1.183.0 scan --config p/dockerfile --error --strict --metrics=off --json Dockerfile 2> >(tee "$REPORT_DIR/semgrep.log" >&2) | tee "$REPORT_DIR/semgrep.json" ;;
            trivy-dockerfile) docker run --rm --mount "type=bind,source=$GITHUB_WORKSPACE/Dockerfile,target=/scan/Dockerfile,readonly" --mount "type=bind,source=$GITHUB_WORKSPACE/.trivyignore,target=/scan/.trivyignore,readonly" aquasec/trivy:0.76.1 config --ignorefile /scan/.trivyignore --exit-code 1 --misconfig-scanners dockerfile --format json /scan 2> >(tee "$REPORT_DIR/trivy-dockerfile.log" >&2) | tee "$REPORT_DIR/trivy-dockerfile.json" ;;
          esac
      - name: Upload scanner report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.id }}-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkov-reports/*
          retention-days: 14
          if-no-files-found: warn

  build-scan-publish:
    needs: dockerfile-scans
    if: ${{ needs.dockerfile-scans.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: docker/setup-buildx-action@v4
      - name: Prepare build artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/checkov-reports"
          echo "REPORT_DIR=$RUNNER_TEMP/checkov-reports" >> "$GITHUB_ENV"
      - name: Build Docker image
        shell: bash
        env:
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -o pipefail
          docker buildx build \
            --load --no-cache --progress=plain \
            --tag checkov:build \
            --label "org.opencontainers.image.source=$IMAGE_SOURCE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            . 2>&1 | tee "$REPORT_DIR/docker-build.log"
      - name: Save build metadata
        run: docker image inspect checkov:build > "$RUNNER_TEMP/checkov-reports/image-metadata.json"
      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.trivyignore,target=/scan/.trivyignore,readonly" \
            aquasec/trivy:0.76.1 image --image-src docker --scanners vuln --exit-code 1 \
            --format json --ignorefile /scan/.trivyignore \
            --skip-dirs /tmp/checkov-venv --skip-dirs .git checkov:build \
            2> >(tee "$REPORT_DIR/trivy-image.log" >&2) | tee "$REPORT_DIR/trivy-image.json"
      - name: Validate Docker Hub username
        id: dockerhub
        if: ${{ github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/')) }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          username="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')"
          [[ "$username" =~ ^[a-z0-9][a-z0-9_-]{0,127}$ ]] || { echo '::error::Invalid Docker Hub username.'; exit 1; }
          echo "username=$username" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        if: ${{ steps.dockerhub.outcome == 'success' }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Determine image version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            mapfile -t tags < <(git tag --points-at HEAD --sort=-version:refname)
            tag="${tags[0]:-sha-$GITHUB_SHA}"
          fi
          [[ "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || exit 1
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Generate image metadata
        id: metadata
        if: ${{ steps.dockerhub.outcome == 'success' }}
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ steps.dockerhub.outputs.username }}/composer
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
      - name: Push Docker image
        if: ${{ steps.metadata.outcome == 'success' }}
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag checkov:build "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/checkov-reports/docker-build.log
            ${{ runner.temp }}/checkov-reports/image-metadata.json
          retention-days: 14
          if-no-files-found: warn
      - name: Upload Trivy image reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkov-reports/trivy-image.*
          retention-days: 14
          if-no-files-found: warn
